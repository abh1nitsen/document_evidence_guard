[project]
name = "drishti-evidence-guard"
version = "0.2.0"
description = "Local-first document evidence checks and escalation telemetry"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7"]

[project.scripts]
evidence-guard = "evidence_guard.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_guard"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
